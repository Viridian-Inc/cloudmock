name: CloudMock
description: Start CloudMock for local AWS emulation in CI. 99 services, one line.
branding:
  icon: cloud
  color: green

inputs:
  source:
    description: Build the checked-out gateway instead of installing npm (requires Go)
    default: 'false'
  version:
    description: CloudMock version to install (npm tag or semver)
    default: latest
  profile:
    description: Service profile (minimal, standard, full)
    default: minimal
  services:
    description: Comma-separated list of services to enable (overrides profile)
    default: ''
  port:
    description: Gateway port
    default: '4566'
  state:
    description: Path to state file to load on startup
    default: ''
  iam-mode:
    description: IAM mode (none, log, enforce)
    default: none
  test-mode:
    description: Enable test mode (disables observability for faster throughput)
    default: 'true'
  iac:
    description: Path to Pulumi or Terraform project directory (auto-provisions DynamoDB tables, etc.)
    default: ''

outputs:
  source-sha:
    description: Checked-out commit used to build the gateway (source mode only)
    value: ${{ steps.install.outputs.source-sha }}
  endpoint:
    description: CloudMock gateway endpoint URL
    value: ${{ steps.start.outputs.endpoint }}
  admin-url:
    description: CloudMock admin API endpoint URL
    value: ${{ steps.start.outputs.admin-url }}
  version:
    description: Installed CloudMock version
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        CM_INPUT_VERSION: ${{ inputs.version }}
        CM_BUILD_SOURCE: ${{ inputs.source }}
      run: |
        if [ "$CM_BUILD_SOURCE" = "true" ]; then
          cd "$GITHUB_WORKSPACE"
          source_sha=$(git rev-parse HEAD)
          source_dir="$RUNNER_TEMP/cloudmock-source"
          mkdir -p "$source_dir"
          go build -ldflags="-s -w -X main.version=source-$source_sha" -o "$source_dir/cloudmock" ./cmd/gateway
          printf '%s\n' "$source_dir" >> "$GITHUB_PATH"
          printf 'source-sha=%s\nversion=source-%s\n' "$source_sha" "$source_sha" >> "$GITHUB_OUTPUT"
          echo "Built CloudMock from source $source_sha at $source_dir/cloudmock"
        else
          if [ "$CM_INPUT_VERSION" = "latest" ]; then
            npm install -g cloudmock
          else
            npm install -g "cloudmock@$CM_INPUT_VERSION"
          fi
          VERSION=$(npm list -g cloudmock --depth=0 2>/dev/null | grep cloudmock | sed 's/.*@//' || echo "unknown")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CloudMock $VERSION installed"
        fi

    - id: start
      shell: bash
      env:
        CLOUDMOCK_PROFILE: ${{ inputs.profile }}
        CLOUDMOCK_IAM_MODE: ${{ inputs.iam-mode }}
        CLOUDMOCK_GATEWAY_PORT: ${{ inputs.port }}
        CLOUDMOCK_SERVICES: ${{ inputs.services }}
        CLOUDMOCK_STATE: ${{ inputs.state }}
        CLOUDMOCK_TEST_MODE: ${{ inputs.test-mode }}
        CLOUDMOCK_IAC_DIR: ${{ inputs.iac }}
      run: |
        args=()
        if [ -n "$CLOUDMOCK_IAC_DIR" ]; then
          args+=(--iac "$CLOUDMOCK_IAC_DIR")
        fi
        log_file="${RUNNER_TEMP:-/tmp}/cloudmock.log"
        nohup cloudmock "${args[@]}" > "$log_file" 2>&1 &
        echo $! > "${RUNNER_TEMP:-/tmp}/cloudmock.pid"

        # Probe the gateway endpoint that subsequent steps will use. An AWS
        # error envelope is expected for an unauthenticated root request.
        HEALTH_URL="http://localhost:$CLOUDMOCK_GATEWAY_PORT"
        echo -n "Waiting for CloudMock..."
        for i in $(seq 1 60); do
          if curl -so /dev/null -w '%{http_code}' "$HEALTH_URL" 2>/dev/null | grep -qE '^[2-4]'; then
            echo " ready!"
            break
          fi
          if [ $i -eq 60 ]; then
            echo " TIMEOUT"
            cat "$log_file"
            exit 1
          fi
          sleep 0.5
        done

        echo "endpoint=http://localhost:$CLOUDMOCK_GATEWAY_PORT" >> "$GITHUB_OUTPUT"
        echo "admin-url=http://localhost:4599" >> "$GITHUB_OUTPUT"

    - shell: bash
      env:
        CLOUDMOCK_GATEWAY_PORT: ${{ inputs.port }}
      run: |
        echo "AWS_ENDPOINT_URL=http://localhost:$CLOUDMOCK_GATEWAY_PORT" >> "$GITHUB_ENV"
        echo "AWS_ACCESS_KEY_ID=test" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=test" >> "$GITHUB_ENV"
        echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"
