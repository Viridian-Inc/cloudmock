name: CloudMock
description: Start CloudMock for local AWS emulation in CI. 99 services, one line.
branding:
  icon: cloud
  color: green

inputs:
  version:
    description: CloudMock version to install (npm tag or semver)
    default: latest
  profile:
    description: Service profile (minimal, standard, full)
    default: minimal
  services:
    description: Comma-separated list of services to enable (overrides profile)
    default: ''
  port:
    description: Gateway port
    default: '4566'
  state:
    description: Path to state file to load on startup
    default: ''
  iam-mode:
    description: IAM mode (none, log, enforce)
    default: none

outputs:
  endpoint:
    description: CloudMock gateway endpoint URL
    value: ${{ steps.start.outputs.endpoint }}
  admin-url:
    description: CloudMock admin API endpoint URL
    value: ${{ steps.start.outputs.admin-url }}
  version:
    description: Installed CloudMock version
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        CM_INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$CM_INPUT_VERSION" = "latest" ]; then
          npm install -g cloudmock
        else
          npm install -g "cloudmock@$CM_INPUT_VERSION"
        fi
        VERSION=$(npm list -g cloudmock --depth=0 2>/dev/null | grep cloudmock | sed 's/.*@//' || echo "unknown")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "CloudMock $VERSION installed"

    - id: start
      shell: bash
      env:
        CLOUDMOCK_PROFILE: ${{ inputs.profile }}
        CLOUDMOCK_IAM_MODE: ${{ inputs.iam-mode }}
        CLOUDMOCK_GATEWAY_PORT: ${{ inputs.port }}
        CLOUDMOCK_SERVICES: ${{ inputs.services }}
        CLOUDMOCK_STATE: ${{ inputs.state }}
      run: |
        log_file="${RUNNER_TEMP:-/tmp}/cloudmock.log"
        nohup cloudmock > "$log_file" 2>&1 &
        echo $! > "${RUNNER_TEMP:-/tmp}/cloudmock.pid"

        # Health check with 30s timeout
        echo -n "Waiting for CloudMock..."
        for i in $(seq 1 60); do
          if curl -so /dev/null -w '%{http_code}' "http://localhost:$CLOUDMOCK_GATEWAY_PORT/" 2>/dev/null | grep -qE '^[2-4]'; then
            echo " ready!"
            break
          fi
          if [ $i -eq 60 ]; then
            echo " TIMEOUT"
            cat "$log_file"
            exit 1
          fi
          sleep 0.5
        done

        echo "endpoint=http://localhost:$CLOUDMOCK_GATEWAY_PORT" >> "$GITHUB_OUTPUT"
        echo "admin-url=http://localhost:4599" >> "$GITHUB_OUTPUT"

    - shell: bash
      env:
        CLOUDMOCK_GATEWAY_PORT: ${{ inputs.port }}
      run: |
        echo "AWS_ENDPOINT_URL=http://localhost:$CLOUDMOCK_GATEWAY_PORT" >> "$GITHUB_ENV"
        echo "AWS_ACCESS_KEY_ID=test" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=test" >> "$GITHUB_ENV"
        echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"
