name: Test CloudMock Action

on:
  push:
    paths:
      - '.github/actions/cloudmock/**'
      - 'github-action/**'
      - '.github/workflows/test-action.yml'
      - 'cmd/gateway/**'
      - 'pkg/config/**'
      - 'pkg/snapshot/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/actions/cloudmock/**'
      - 'github-action/**'
      - '.github/workflows/test-action.yml'
      - 'cmd/gateway/**'
      - 'pkg/config/**'
      - 'pkg/snapshot/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOPRIVATE: github.com/Viridian-Inc/cloudmock
      GONOSUMCHECK: github.com/Viridian-Inc/cloudmock
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build gateway from this checkout
        run: go build -o "$RUNNER_TEMP/cloudmock-action-gateway" ./cmd/gateway
      - name: Test both action definitions and live gateway behavior
        env:
          CLOUDMOCK_ACTION_TEST_BINARY: ${{ runner.temp }}/cloudmock-action-gateway
        run: go test -v ./github-action -count=1 -timeout 180s
